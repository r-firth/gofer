[package]
name = "hub-graphics"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Document"] }
js-sys = "0.3"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
