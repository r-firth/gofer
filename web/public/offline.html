<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101011">
  <title>Gofer — Connection unavailable</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#101011;color:#f1efeb;font:16px system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:32px}main{max-width:340px}svg{width:48px;height:48px}small{display:block;margin:32px 0 16px;color:#ff995f;font:12px monospace;letter-spacing:.12em}h1{font-size:26px;font-weight:500;line-height:1.2}p{color:#aaa6a2;line-height:1.6}button{margin-top:18px;min-height:48px;padding:0 24px;font:inherit;color:#ff995f;background:#181818;border:1px solid #a7704e;border-radius:2px;cursor:pointer}button:focus-visible{outline:2px solid #ff995f;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" aria-label="Gofer"><path fill="#e8d7bb" d="M10 2h12v4h4v4h4v12h-4V12h-4V8H10zM2 10h4v10h4v4h12v6H10v-4H6v-4H2z"/><path fill="#e89a63" d="M10 12h4V8h4v4h4v8h-4v4h-4v-4h-4z"/><path fill="#161616" d="M14 14h4v4h-4z"/><path fill="#a7704e" d="M6 6h4v4H6zM22 22h4v4h-4z"/></svg>
    <small>CONNECTION UNAVAILABLE</small>
    <h1>Your workspace is out of reach.</h1>
    <p>Connect to Tailscale and check that your home server is awake, then try again.</p>
    <button onclick="location.reload()">Reconnect</button>
  </main>
  <script>
    // Leave this screen on its own once the workspace answers again.
    let checking = false;
    const retry = async () => {
      if (checking || document.hidden) return;
      checking = true;
      try {
        const response = await fetch("/", { cache: "no-store", signal: AbortSignal.timeout(5000) });
        if (response.ok) return location.reload();
      } catch {}
      checking = false;
    };
    setInterval(retry, 5000);
    addEventListener("online", retry);
    document.addEventListener("visibilitychange", retry);
  </script>
</body>
</html>
